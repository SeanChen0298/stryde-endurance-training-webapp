# Runs the backend's morning jobs (Garmin sync → AI brief → plan revision).
# The backend runs as Vercel serverless functions, so it has no in-app
# scheduler; this workflow calls POST /cron/daily instead.
#
# Needs two repo secrets (Settings → Secrets and variables → Actions):
#   BACKEND_URL  e.g. https://stryde-backend.vercel.app
#   CRON_SECRET  same value as CRON_SECRET in the backend's Vercel environment
name: daily-jobs

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 06:00 MYT
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip if secrets are not set
        id: check
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::BACKEND_URL or CRON_SECRET not set — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Warms the function so a cold start doesn't eat into the jobs' time limit
      - name: Wake backend
        if: steps.check.outputs.skip != 'true'
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 6 --retry-delay 15 --retry-all-errors \
            "$BACKEND_URL/health"

      - name: Start daily jobs
        if: steps.check.outputs.skip != 'true'
        run: |
          # Runs the jobs inline; no retry so a slow run isn't started twice
          curl --fail --silent --show-error --max-time 310 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            "$BACKEND_URL/cron/daily"
