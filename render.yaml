# Render Blueprint for the backend (render.com → New → Blueprint → pick this repo).
# The frontend stays on Vercel. Secrets marked `sync: false` are entered in the
# Render dashboard on first deploy and are never stored in this file.
services:
  - type: web
    name: stryde-backend
    runtime: python
    plan: free
    region: singapore          # same region as the Neon database
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # The free instance sleeps when idle, so the in-app scheduler can't be
      # relied on. .github/workflows/daily-jobs.yml calls /cron/daily instead.
      - key: RUN_SCHEDULER
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_ENCRYPTION_KEY
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_WEBHOOK_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CRON_SECRET
        generateValue: true
